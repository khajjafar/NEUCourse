openapi: 3.0.0
info:
  title: NEUCourse API
  version: 1.0.0
  description: >
    REST API for NEUCourse — Northeastern University degree planning and scheduling.
    All authenticated endpoints require a Firebase ID token in the
    `Authorization: Bearer <token>` header. Course endpoints are public.

servers:
  - url: /api/v1
    description: Production (Vercel)

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Firebase ID token obtained via getIdToken()

  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string

    Course:
      type: object
      properties:
        id:
          type: string
          example: CS3500
        subject:
          type: string
          example: CS
        number:
          type: string
          example: "3500"
        name:
          type: string
          example: Object-Oriented Design
        description:
          type: string
        prereqs:
          type: array
          items:
            type: string
        coreqs:
          type: array
          items:
            type: string
        sections:
          type: array
          items:
            type: object
            properties:
              crn:
                type: string
              meetingTimes:
                type: string
                example: MWF 10:30am – 11:35am
              rooms:
                type: string
              professor:
                type: string
              seats:
                type: number
              campus:
                type: string

    Plan:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
          example: My 4-Year Plan
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        semesterCount:
          type: number

    Semester:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
          example: Fall 2026
        order:
          type: number
          example: 0
        courses:
          type: array
          items:
            oneOf:
              - type: string
                description: courseId (legacy string format)
              - type: object
                properties:
                  courseId:
                    type: string
                    example: CS3500
                  crn:
                    type: string
                    example: "10243"

    CalendarEvent:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
          example: CS3500 Lecture
        startTime:
          type: string
          example: "2026-09-08T10:30:00"
        endTime:
          type: string
          example: "2026-09-08T11:35:00"
        location:
          type: string
          example: Shillman Hall 105
        color:
          type: string
          example: blue
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

paths:
  # ── Courses (public) ────────────────────────────────────────────────

  /courses:
    get:
      tags: [Courses]
      summary: Search / list courses
      description: >
        Returns up to 50 pre-scraped NEU courses. All query params are optional.
        Results are filtered from an in-memory cache (refreshed hourly).
      parameters:
        - in: query
          name: q
          schema:
            type: string
          description: Free-text search across courseId, name, and subject.
        - in: query
          name: subject
          schema:
            type: string
          description: Exact subject code, e.g. CS or MATH.
        - in: query
          name: minLevel
          schema:
            type: integer
          description: Minimum course number, e.g. 3000.
        - in: query
          name: maxLevel
          schema:
            type: integer
          description: Maximum course number, e.g. 4999.
      responses:
        "200":
          description: Array of matching courses (max 50)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Course"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /courses/{courseId}:
    get:
      tags: [Courses]
      summary: Get a single course
      description: Returns the full Firestore document for a specific course by its ID.
      parameters:
        - in: path
          name: courseId
          required: true
          schema:
            type: string
          example: CS3500
      responses:
        "200":
          description: Course data
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Course"
        "404":
          description: Course not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ── Plans (authenticated) ────────────────────────────────────────────

  /plans:
    get:
      tags: [Plans]
      summary: List degree plans
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Array of the user's degree plans
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Plan"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    post:
      tags: [Plans]
      summary: Create a degree plan
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  example: My 4-Year Plan
      responses:
        "201":
          description: Plan created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      name:
                        type: string
        "400":
          description: Missing or invalid plan name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /plans/{planId}:
    get:
      tags: [Plans]
      summary: Get a plan with its semesters
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: planId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Plan with nested semesters array
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Plan not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    put:
      tags: [Plans]
      summary: Rename a plan
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: planId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
      responses:
        "200":
          description: Plan renamed
        "400":
          description: Invalid name
        "401":
          description: Unauthorized
        "404":
          description: Plan not found

    patch:
      tags: [Plans]
      summary: Partial update a plan
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: planId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
      responses:
        "200":
          description: Plan updated
        "400":
          description: Empty or invalid body
        "401":
          description: Unauthorized
        "404":
          description: Plan not found

    delete:
      tags: [Plans]
      summary: Delete a plan
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: planId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Plan deleted
        "401":
          description: Unauthorized
        "404":
          description: Plan not found

  # ── Semesters ────────────────────────────────────────────────────────

  /plans/{planId}/semesters:
    post:
      tags: [Semesters]
      summary: Add a semester to a plan
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: planId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  example: Fall 2026
                order:
                  type: number
                  example: 0
      responses:
        "201":
          description: Semester created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Semester"
        "400":
          description: Missing required fields
        "401":
          description: Unauthorized

  /plans/{planId}/semesters/{semId}:
    patch:
      tags: [Semesters]
      summary: Update semester (name, order, or courses array)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: planId
          required: true
          schema:
            type: string
        - in: path
          name: semId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                order:
                  type: number
                courses:
                  type: array
                  items:
                    type: object
      responses:
        "200":
          description: Semester updated
        "400":
          description: No update data provided
        "401":
          description: Unauthorized
        "404":
          description: Plan or semester not found

    delete:
      tags: [Semesters]
      summary: Delete a semester
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: planId
          required: true
          schema:
            type: string
        - in: path
          name: semId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Semester deleted
        "401":
          description: Unauthorized

  /plans/{planId}/semesters/{semId}/courses:
    post:
      tags: [Semesters]
      summary: Add a course to a semester
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: planId
          required: true
          schema:
            type: string
        - in: path
          name: semId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [courseId]
              properties:
                courseId:
                  type: string
                  example: CS3500
                crn:
                  type: string
                  example: "10243"
      responses:
        "200":
          description: Course added
        "400":
          description: Missing courseId
        "401":
          description: Unauthorized
        "404":
          description: Plan or semester not found

  /plans/{planId}/semesters/{semId}/courses/{courseId}:
    delete:
      tags: [Semesters]
      summary: Remove a course from a semester
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: planId
          required: true
          schema:
            type: string
        - in: path
          name: semId
          required: true
          schema:
            type: string
        - in: path
          name: courseId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Course removed
        "401":
          description: Unauthorized
        "404":
          description: Plan or semester not found

  # ── Calendar Events (authenticated) ──────────────────────────────────

  /events:
    get:
      tags: [Events]
      summary: List all calendar events
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Array of events ordered by startTime asc
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/CalendarEvent"
        "401":
          description: Unauthorized
        "500":
          description: Server error

    post:
      tags: [Events]
      summary: Create a calendar event
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, startTime, endTime]
              properties:
                title:
                  type: string
                  example: CS3500 Lecture
                startTime:
                  type: string
                  example: "2026-09-08T10:30:00"
                endTime:
                  type: string
                  example: "2026-09-08T11:35:00"
                location:
                  type: string
                  example: Shillman Hall 105
                color:
                  type: string
                  example: blue
      responses:
        "201":
          description: Event created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/CalendarEvent"
        "400":
          description: Missing required fields
        "401":
          description: Unauthorized

  /events/{eventId}:
    put:
      tags: [Events]
      summary: Update a calendar event
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: eventId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, startTime, endTime]
              properties:
                title:
                  type: string
                startTime:
                  type: string
                endTime:
                  type: string
                location:
                  type: string
                color:
                  type: string
      responses:
        "200":
          description: Event updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/CalendarEvent"
        "400":
          description: Missing required fields
        "401":
          description: Unauthorized
        "404":
          description: Event not found

    delete:
      tags: [Events]
      summary: Delete a calendar event
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: eventId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Event deleted
        "401":
          description: Unauthorized
        "404":
          description: Event not found
